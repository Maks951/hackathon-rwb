[project]
name = "rwb-platform"
version = "0.1.0"
description = "Runs API and generation orchestration (Yaroslav's component)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "SQLAlchemy==2.0.41",
  "psycopg[binary]==3.2.9",
  "alembic==1.16.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
